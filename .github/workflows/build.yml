name: build

# Clean-checkout build gate (getting-started §9), on the RetroFuturaGradle stack.
#
# Homelab option: swap `runs-on: ubuntu-latest` for a self-hosted runner label to
# keep this in-house.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle & RFG
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
