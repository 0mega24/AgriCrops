plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.0'
}

allprojects {
    group = 'dev.omega24.agricrops'
    version = '0.2.0-SNAPSHOT'
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

base { archivesName = 'agricrops' }
java { toolchain { languageVersion = JavaLanguageVersion.of(8) } }

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'snapshot'
    mcpMappingVersion = '20180710'
    username = 'Developer'
}

repositories { mavenCentral() }

dependencies {
    implementation project(':core')
}

// Keep the rule module available inside the distributed mod, not as another required mod jar.
evaluationDependsOn(':core')
tasks.named('jar', Jar) {
    dependsOn ':core:classes'
    from project(':core').sourceSets.main.output
    from(['LICENSE', 'NOTICE']) { into 'META-INF' }
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'modVersion', project.version
    filesMatching('mcmod.info') { expand(version: project.version) }
}

tasks.named('check') { dependsOn ':core:check' }

tasks.withType(Test).configureEach {
    maxParallelForks = 1
    maxHeapSize = '128m'
}

tasks.withType(JavaExec).configureEach {
    minHeapSize = '256m'
    maxHeapSize = '1G'
}
