plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.0'
}

allprojects {
    group = 'dev.omega24.agricrops'
    version = '0.2.0-SNAPSHOT'
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

base { archivesName = 'agricrops' }
java { toolchain { languageVersion = JavaLanguageVersion.of(8) } }

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'snapshot'
    mcpMappingVersion = '20180710'
    username = 'Developer'
}

repositories {
    maven { url = 'https://maven.blamejared.com' }
    mavenCentral()
}

dependencies {
    implementation project(':core')
    compileOnly 'CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.715'
    testImplementation 'junit:junit:4.13.2'
    // Opt in for deliberate development runtime checks; absent in the base installation.
    if (providers.gradleProperty('withCraftTweaker').isPresent()) {
        runtimeOnly rfg.deobf('CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.715')
    }
}

// Keep the rule module available inside the distributed mod, not as another required mod jar.
evaluationDependsOn(':core')
tasks.named('jar', Jar) {
    dependsOn ':core:classes'
    from project(':core').sourceSets.main.output
    from(['LICENSE', 'NOTICE']) { into 'META-INF' }
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'modVersion', project.version
    filesMatching('mcmod.info') { expand(version: project.version) }
}

tasks.named('check') { dependsOn ':core:check' }

tasks.withType(Test).configureEach {
    maxParallelForks = 1
    maxHeapSize = '128m'
}

tasks.withType(JavaExec).configureEach {
    minHeapSize = '256m'
    maxHeapSize = '1G'
    if (providers.gradleProperty('devChecks').isPresent()) systemProperty 'agricrops.devChecks', 'true'
}
